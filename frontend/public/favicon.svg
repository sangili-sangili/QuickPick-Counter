<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#E2231A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

  <!-- Popcorn Kernels / Snack Top -->
  <g filter="url(#glow)">
    <circle cx="25" cy="18" r="4.5" fill="#FDE047" />
    <circle cx="33" cy="16" r="5" fill="#FEF08A" />
    <circle cx="39" cy="18" r="4.5" fill="#FACC15" />
    <circle cx="29" cy="14" r="4" fill="#FEF9C3" />
    <circle cx="21" cy="20" r="4" fill="#FACC15" />
    <circle cx="43" cy="21" r="3.5" fill="#FEF08A" />

    <!-- Snack Cup / Popcorn Bucket -->
    <path d="M20 24 L24.5 49 C24.8 51.2 26.7 52.8 29 52.8 L35 52.8 C37.3 52.8 39.2 51.2 39.5 49 L44 24 Z" fill="#FFFFFF" />

    <!-- Red Stripes on Cup -->
    <path d="M25 24 L27.7 49 L30.2 49 L28.8 24 Z" fill="#E2231A" />
    <path d="M35.2 24 L33.8 49 L36.3 49 L39 24 Z" fill="#E2231A" />

    <!-- Lightning Bolt / Instant Kiosk Symbol -->
    <polygon points="32.5,28 29.5,37 32.5,37 31.5,45 36.5,35.5 33.5,35.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="0.8" stroke-linejoin="round" />
  </g>
</svg>
